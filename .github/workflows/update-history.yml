name: Auktions-Verlauf aktualisieren

on:
  # Der Zeitplan wird jetzt EXTERN von cron-job.org ausgelöst (alle 15 Min)
  # über die GitHub-API. Deshalb ist GitHubs eigener "schedule"-Cron
  # bewusst NICHT mehr aktiv - er lief unzuverlässig.
  workflow_dispatch: {}   # wird von cron-job.org (und manuell) gestartet

permissions:
  contents: write

concurrency:
  group: history-updater
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verlauf aktualisieren
        env:
          # Der Ereignisstrom des Auktionshauses (seit 23.09.2026).
          #
          #   beobachten  Der Strom läuft und rechnet, schreibt aber
          #               nichts. Das Protokoll dieses Schritts sagt am
          #               Ende, was er archiviert HÄTTE und wie es sich
          #               zum bisherigen Vergleich verhält.
          #   an          Der Strom archiviert mit.
          #   aus         Kein Strom.
          #
          # Steht seit dem 23.09.2026 auf `an`. Der Beobachten-Lauf
          # #22145 hat gezeigt, dass der Strom hält, was er verspricht:
          # 23 Ereignisse, genau die Lücke seit dem letzten Lauf, zwei
          # Verkäufe, die der Vergleich gar nicht gesehen hätte, und
          # nichts Verworfenes.
          #
          # Zurück auf `beobachten` oder `aus`, falls sich der Strom
          # anders verhält als gedacht — der Vergleich läuft in jedem
          # Fall mit, die Zahlen wären dann nur wieder die alten.
          STROM: an
        run: |
          node history-updater/update-history.js
          node history-updater/update-shards.js

      - name: Heartbeat schreiben (garantiert einen Commit pro Lauf)
        run: date -u '+%Y-%m-%dT%H:%M:%SZ' > history-updater/last-run.txt

      - name: Committen und pushen
        run: |
          git config user.name "history-bot"
          git config user.email "actions@github.com"
          # Jede Datei, die ein Lauf schreibt, muss hier stehen — was fehlt,
          # baut der Lauf umsonst und der nächste Checkout wirft es weg.
          git add auction-history.json shard-history.json wert-index.json \
                  history-updater/state.json history-updater/namen.json \
                  history-updater/last-run.txt
          if git diff --staged --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Verlauf aktualisiert ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git push
          fi
